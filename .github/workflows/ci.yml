name: Chopee CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Spring Boot 3 + Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Backend (Maven Test & Build)
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "📦 Building and Testing Spring Boot Backend..."
            cd backend
            mvn -B clean test
          else
            echo "ℹ️ backend/pom.xml not found yet. Skipping until backend scaffolding is completed."
          fi

  frontend-ci:
    name: Frontend CI (React + Vite + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Verify Frontend (Build & Type Check)
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "⚛️ Building and Type-checking React Frontend..."
            cd frontend
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            npm run build
          else
            echo "ℹ️ frontend/package.json not found yet. Skipping until frontend scaffolding is completed."
          fi
